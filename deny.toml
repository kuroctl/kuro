# `cargo deny check` (ADR-0016) : avis de sécurité, licences, sources et doublons des dépendances.
# Lancé en CI ; en local : `cargo deny check` (voir docs/developpement.md).

[graph]
# Seules les cibles livrées comptent (le daemon et l'API ne tournent pas ailleurs).
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Toute faille connue fait échouer la CI ; une exception s'ajoute ici avec sa justification.
ignore = []
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Licences permissives uniquement : aucune obligation de redistribution du code de Kuro.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Crates du workspace, jamais publiées (`publish = false`).
ignore = true

[bans]
# Les doublons de version (deux `base64`, deux `sha2`…) sont signalés sans bloquer : ils viennent
# des dépendances, pas de nous.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS : rustls uniquement (CLAUDE.md).
    { crate = "openssl", reason = "rustls only" },
    { crate = "openssl-sys", reason = "rustls only" },
    { crate = "native-tls", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
