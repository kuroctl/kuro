# Publication (ADR-0016) sur tag `vX.Y.Z` : binaires Linux musl, panel compilé, prefabs, sommes
# SHA-256 signées par minisign. `vX.Y.Z-rc.N` est publié en pré-version.
#
# Secrets requis : `MINISIGN_SECRET_KEY` (contenu du fichier de clé privée) et
# `MINISIGN_PASSWORD`. La clé publique correspondante est inscrite dans `scripts/install.sh`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  version:
    name: Version du tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        # Le tag doit correspondre à la version du workspace (Cargo.toml).
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kuro-api") | .version')"
          if [ "${tag%%-*}" != "$crate" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $crate" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  panel:
    name: Panel
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: panel/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: panel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: panel
          path: panel/dist

  binaries:
    name: Binaires ${{ matrix.target }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p kuro-api -p kuro-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/kuro-api
            target/${{ matrix.target }}/release/kuro-daemon
            target/${{ matrix.target }}/release/kuro-daemonctl

  publish:
    name: Publication
    needs: [version, panel, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Prefabs officiels : sous-module `kuroctl/prefabs` au commit épinglé (ADR-0041).
      - uses: actions/checkout@v7
        with:
          submodules: true
      # Un sous-module vide donnerait une archive de l'API sans prefabs (ADR-0042).
      - name: Prefabs présents
        run: |
          if ! ls prefabs/*/prefab.yaml >/dev/null 2>&1; then
            echo "prefabs/ is empty: the kuroctl/prefabs submodule was not checked out" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Archives
        run: |
          mkdir dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            bin="artifacts/bin-$target"
            api="kuro-api-$VERSION-$target"
            mkdir -p "$api"
            install -m 0755 "$bin/kuro-api" "$api/"
            cp -r artifacts/panel "$api/panel"
            # Les prefabs seuls : sans les métadonnées du sous-module.
            cp -r prefabs "$api/prefabs"
            rm -rf "$api/prefabs/.git" "$api/prefabs/.github" "$api/prefabs/.gitattributes"
            tar -czf "dist/$api.tar.gz" "$api"

            daemon="kuro-daemon-$VERSION-$target"
            mkdir -p "$daemon"
            install -m 0755 "$bin/kuro-daemon" "$bin/kuro-daemonctl" "$daemon/"
            tar -czf "dist/$daemon.tar.gz" "$daemon"
          done
          cp scripts/install.sh dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Signature
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" \
            -m dist/SHA256SUMS -t "kuro $VERSION"
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes $prerelease
