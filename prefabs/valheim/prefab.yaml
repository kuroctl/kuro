# yaml-language-server: $schema=../schema/prefab.v1.schema.json
# Valheim : serveur dédié Linux (app Steam 896660), installé par SteamCMD.
# Image d'exécution : celle des eggs Pterodactyl pour Valheim (Ubuntu 22.04, bibliothèques audio
# et SDL du serveur). Kuro garde son point d'entrée, qui lit la ligne de lancement dans `STARTUP` ;
# les réglages y arrivent par l'environnement, jamais collés dans la commande (ADR-0027).
schema: kuro.prefab/v1
id: valheim
version: 1.1.0
category: game
tags: [valheim, survival, steam]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
  # Ressources du serveur entier (ADR-0031) : minimum bloquant, valeur recommandée pré-remplie.
  resources:
    memory_mb: { min: 4096, recommended: 4096 }
    disk_mb: { min: 3072, recommended: 10240 }
assets:
  icon: assets/icon.png
  cover: assets/banner.webp
  thumbnail: assets/thumbnail.webp

services:
  server:
    # Épinglée par empreinte : le tag `games:valheim` est mis à jour en continu.
    image: ghcr.io/ptero-eggs/games@sha256:5ade5bcfc0c00ad26fd1bac8ff35b6e5e48d8c6cb70ddb5ba72f448520956e24
    env:
      STARTUP: './valheim_server.x86_64 -nographics -batchmode -name "${SERVER_NAME}" -port ${SERVER_PORT} -world "${WORLD_NAME}" -password "${SERVER_PASS}" -public ${PUBLIC} -preset ${PRESET} -saveinterval ${SAVE_INTERVAL} -backups ${BACKUPS} -savedir /home/container/saves'
      # Mises à jour faites par Kuro (réinstallation), jamais par le point d'entrée de l'image.
      AUTO_UPDATE: "0"
      LD_LIBRARY_PATH: /home/container/linux64
      # Identifiant du jeu (et non du serveur) attendu par la bibliothèque Steam.
      SteamAppId: "892970"
      SERVER_NAME: "{{ settings.server_name }}"
      WORLD_NAME: "{{ settings.world_name }}"
      SERVER_PASS: "{{ settings.password }}"
      PUBLIC: "{{ settings.public }}"
      PRESET: "{{ settings.preset }}"
      SAVE_INTERVAL: "{{ settings.save_interval }}"
      BACKUPS: "{{ settings.backups }}"
      SERVER_PORT: "{{ ports.game.container }}"
    ports:
      # Le port de requête est toujours celui du jeu + 1 : réserver deux ports consécutifs.
      game: { container: 2456, protocol: udp, public: true }
      query: { container: 2457, protocol: udp, public: true }
    volumes:
      data: { path: /home/container }
    # Le point d'entrée écrit son identité d'utilisateur (nss_wrapper) dans /tmp.
    writable: [/tmp]
    user: "1000:1000"

install:
  service: server
  steps:
    - steamcmd: { app: 896660, dir: /home/container, validate: true }

settings:
  general:
    server:
      icon: server
      fields:
        server_name: { type: string, default: "Kuro Valheim", max_length: 60, required: true, restart: true }
        password:
          type: password
          required: true
          # 5 caractères au moins ; le serveur refuse aussi un mot de passe contenu dans le nom
          # du serveur ou du monde.
          pattern: "^.{5,64}$"
          restart: true
        public: { type: enum, options: ["1", "0"], default: "1", restart: true }
    world:
      icon: globe
      fields:
        world_name: { type: string, default: Dedicated, pattern: "^[A-Za-z0-9_-]{1,20}$", restart: true }
        preset: { type: enum, options: [normal, casual, easy, hard, hardcore, immersive, hammer], default: normal, restart: true }
  advanced:
    saves:
      icon: archive
      fields:
        save_interval: { type: int, default: 1800, min: 60, max: 7200, restart: true }
        backups: { type: int, default: 4, min: 1, max: 20, restart: true }

files:
  adminlist:
    service: server
    path: /home/container/saves/adminlist.txt
    format: text
    mode: user
  bannedlist:
    service: server
    path: /home/container/saves/bannedlist.txt
    format: text
    mode: user
  permittedlist:
    service: server
    path: /home/container/saves/permittedlist.txt
    format: text
    mode: user

backup:
  ignore:
    server: [/home/container/valheim_server_Data/**, /home/container/linux64/**, /home/container/steamapps/**]

lifecycle:
  service: server
  ready: { console: 'Game server connected' }
  # Pas de console interactive : SIGINT enregistre le monde puis arrête le serveur.
  stop: { signal: SIGINT }
  timeout: 120
