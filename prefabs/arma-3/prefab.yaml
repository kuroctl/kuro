# yaml-language-server: $schema=https://raw.githubusercontent.com/kuroctl/kuro/main/shared/prefab/schema/prefab.v1.schema.json
# Arma 3 : serveur dédié Linux (app Steam 233780). SteamCMD refuse de le télécharger en anonyme :
# l'installation se connecte avec le compte Steam de l'installation, réglé dans le panel
# (ADR-0033). Ce compte n'a pas besoin de posséder le jeu.
# Image d'exécution : celle des eggs Pterodactyl pour Arma 3. Kuro garde son point d'entrée, qui
# lit la ligne de lancement dans `STARTUP` ; ses mises à jour au démarrage sont coupées (elles
# demanderaient le compte Steam dans l'environnement du serveur) : Kuro met à jour en réinstallant.
schema: kuro.prefab/v1
id: arma-3
version: 0.1.0
category: game
tags: [arma-3, military, simulation, steam]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
  # Ressources du serveur entier (ADR-0031) ; les mods font vite grossir le disque.
  resources:
    memory_mb: { min: 2048, recommended: 3072 }
    disk_mb: { min: 10240, recommended: 51200 }
assets:
  icon: assets/icon.png
  cover: assets/banner.webp
  thumbnail: assets/thumbnail.webp
x-status: "draft: not yet tried on a real node with a Steam account"
# Jeu sur le magasin Steam : le Studio en importe les images (ADR-0039).
steam: { app: 107410 }

services:
  server:
    # Épinglée par empreinte : le tag `games:arma3` est mis à jour en continu.
    image: ghcr.io/ptero-eggs/games@sha256:c14eac53c77b73856ff241bc71b5a02472d17ab7a9cc061ccf8d13c27070bb90
    env:
      STARTUP: './arma3server_x64 -ip=0.0.0.0 -port=${SERVER_PORT} -profiles=./serverprofile -bepath=./ -cfg=basic.cfg -config=server.cfg -noLogs'
      SERVER_PORT: "{{ ports.game.container }}"
      SERVER_BINARY: arma3server_x64
      STARTUP_PARAMS: "-noLogs"
      # Mises à jour faites par Kuro (réinstallation), jamais par le point d'entrée de l'image.
      UPDATE_SERVER: "0"
      VALIDATE_SERVER: "0"
      DISABLE_MOD_UPDATES: "1"
      HC_NUM: "0"
      CLEAR_CACHE: "0"
      MODS_LOWERCASE: "0"
    ports:
      # Ports dérivés du port du jeu : +1 (requête Steam), +2 (Steam), +4 (BattlEye). Réserver une
      # plage consécutive.
      game: { container: 2302, protocol: udp, public: true }
      query: { container: 2303, protocol: udp, public: true }
      steam: { container: 2304, protocol: udp, public: true }
      battleye: { container: 2306, protocol: udp, public: true }
    volumes:
      data: { path: /home/container }
    # Le point d'entrée écrit son identité d'utilisateur (nss_wrapper) dans /tmp.
    writable: [/tmp]
    user: "1000:1000"

install:
  service: server
  steps:
    - steamcmd: { app: 233780, dir: /home/container, validate: true, login: account }

settings:
  general:
    server:
      icon: server
      fields:
        # Écrits entre guillemets dans server.cfg : ni guillemet ni barre oblique inverse.
        server_name: { type: string, default: "Kuro Arma 3", pattern: '^[^"\\]{1,80}$', required: true, restart: true }
        password: { type: password, pattern: '^[^"\\]{0,64}$', restart: true }
        max_players: { type: int, default: 32, min: 1, max: 256, restart: true }
    administration:
      icon: shield
      fields:
        admin_password: { type: secret, generate: { length: 24 } }
        battleye: { type: enum, options: ["1", "0"], default: "1", restart: true }

files:
  server-cfg:
    service: server
    path: /home/container/server.cfg
    format: cfg
    mode: template
    template: templates/server.cfg
  basic-cfg:
    service: server
    path: /home/container/basic.cfg
    format: cfg
    mode: user
    template: templates/basic.cfg

backup:
  ignore:
    server: [/home/container/steamapps/**, /home/container/addons/**, /home/container/dta/**]

lifecycle:
  service: server
  ready: { console: 'Host identity created.' }
  # SIGINT : arrêt propre, comme le prévoit l'image.
  stop: { signal: SIGINT }
  timeout: 60
