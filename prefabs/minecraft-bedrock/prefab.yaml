# yaml-language-server: $schema=../schema/prefab.v1.schema.json
# Minecraft Bedrock Edition (consoles, mobiles, Windows). L'image itzg/minecraft-bedrock-server
# télécharge elle-même le serveur officiel au démarrage (pas de bloc `install`) et réécrit les
# clés de server.properties depuis son environnement à chaque démarrage.
# Transport RakNet : un seul port UDP. NetherNet (défaut depuis 1.26.50) demande un port UDP par
# joueur, que l'allocation de ports de Kuro ne sait pas réserver.
schema: kuro.prefab/v1
id: minecraft-bedrock
version: 1.1.0
category: game
tags: [minecraft, bedrock, sandbox]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
assets:
  icon: assets/icon.png
  cover: assets/banner.png
  thumbnail: assets/thumbnail.png

services:
  server:
    # Tag daté figé (jamais `latest`).
    image: docker.io/itzg/minecraft-bedrock-server:2026.10.2
    env:
      EULA: "TRUE"
      VERSION: "{{ settings.version }}"
      TRANSPORT: raknet
      SERVER_PORT: "{{ ports.game.container }}"
      SERVER_PORT_V6: "{{ ports.game_v6.container }}"
      SERVER_NAME: "{{ settings.server_name }}"
      GAMEMODE: "{{ settings.gamemode }}"
      DIFFICULTY: "{{ settings.difficulty }}"
      MAX_PLAYERS: "{{ settings.max_players }}"
      ALLOW_CHEATS: "{{ settings.allow_cheats }}"
      ONLINE_MODE: "{{ settings.online_mode }}"
      # Vide par défaut, la liste blanche refuserait tout le monde : désactivée sauf demande.
      ALLOW_LIST: "{{ settings.allow_list }}"
      LEVEL_NAME: "{{ settings.level_name }}"
      LEVEL_SEED: "{{ settings.level_seed }}"
      VIEW_DISTANCE: "{{ settings.view_distance }}"
      TICK_DISTANCE: "{{ settings.tick_distance }}"
      OPS: "{{ settings.ops }}"
    ports:
      game: { container: 19132, protocol: udp, public: true }
      # IPv6 : jamais publié (les nœuds publient en IPv4).
      game_v6: { container: 19133, protocol: udp }
    volumes:
      data: { path: /data }
    writable: [/tmp]
    user: "1000:1000"

settings:
  general:
    server:
      icon: server
      fields:
        server_name: { type: string, default: "Kuro Bedrock", max_length: 64, restart: true }
        max_players: { type: int, default: 10, min: 1, max: 200, restart: true }
        gamemode: { type: enum, options: [survival, creative, adventure], default: survival, restart: true }
        difficulty: { type: enum, options: [peaceful, easy, normal, hard], default: normal, restart: true }
        allow_cheats: { type: bool, default: false, restart: true }
    version:
      icon: package
      fields:
        version: { type: string, default: LATEST, pattern: "^(LATEST|PREVIEW|\\d+\\.\\d+\\.\\d+(\\.\\d+)?)$", restart: true }
  advanced:
    world:
      icon: globe
      fields:
        level_name: { type: string, default: Bedrock level, pattern: "^[A-Za-z0-9 _-]{1,32}$", editable: deploy, restart: true }
        level_seed: { type: string, max_length: 64, editable: deploy }
        view_distance: { type: slider, min: 5, max: 32, step: 1, default: 10, restart: true }
        tick_distance: { type: slider, min: 4, max: 12, step: 1, default: 4, restart: true }
    security:
      icon: shield
      fields:
        online_mode: { type: bool, default: true, restart: true }
        allow_list: { type: bool, default: false, restart: true }
        ops: { type: string, max_length: 512, pattern: "^[A-Za-z0-9 ,_-]*$", restart: true }

files:
  server-properties:
    service: server
    path: /data/server.properties
    format: properties
    mode: user
  allowlist:
    service: server
    path: /data/allowlist.json
    format: json
    mode: user
  permissions:
    service: server
    path: /data/permissions.json
    format: json
    mode: user

# Sauvegarde à chaud : écritures suspendues, puis attente que le monde soit prêt à copier.
# Add-ons (ADR-0030) : une archive `.mcpack` ou `.mcaddon` est extraite en packs, chacun rangé
# d'après le type de module de son manifest.json, puis inscrit dans le monde.
content:
  addons:
    kind: addons
    service: server
    providers:
      # Envoi d'un .mcpack depuis l'ordinateur : pas encore (le nœud n'extrait que ce qu'il
      # télécharge).
      - { provider: curseforge, game: minecraft-bedrock, class: addons }
    install:
      mode: extract
      describe: manifest.json
      route:
        - { when: { value: modules.0.type, is: data }, dir: /data/behavior_packs }
        - { when: { value: modules.0.type, is: script }, dir: /data/behavior_packs }
        - { when: { value: modules.0.type, is: resources }, dir: /data/resource_packs }
    register:
      - file: "/data/worlds/{{ settings.level_name }}/world_behavior_packs.json"
        when: { value: modules.0.type, is: data }
        entry: { pack_id: "{{ item.header.uuid }}", version: "{{ item.header.version }}" }
      - file: "/data/worlds/{{ settings.level_name }}/world_behavior_packs.json"
        when: { value: modules.0.type, is: script }
        entry: { pack_id: "{{ item.header.uuid }}", version: "{{ item.header.version }}" }
      - file: "/data/worlds/{{ settings.level_name }}/world_resource_packs.json"
        when: { value: modules.0.type, is: resources }
        entry: { pack_id: "{{ item.header.uuid }}", version: "{{ item.header.version }}" }

backup:
  before:
    - { console: save hold }
    - { console: save query, wait: 'Files are now ready to be copied' }
  after:
    - { console: save resume }

lifecycle:
  service: server
  ready: { console: 'Server started\.' }
  stop: { console: stop }
  timeout: 60
