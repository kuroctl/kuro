# yaml-language-server: $schema=https://raw.githubusercontent.com/kuroctl/kuro/main/shared/prefab/schema/prefab.v1.schema.json
# ARK : Survival Ascended. Le serveur dédié (app Steam 2430930) n'existe qu'en version Windows :
# SteamCMD force la plateforme Windows (ADR-0032), Proton GE 10 l'exécute. Proton GE 11 bloque
# ArkAscendedServer.exe au démarrage (signalé par la communauté). Lancement : templates/start.sh.
# Brouillon tant qu'aucun essai réel n'a confirmé le démarrage et l'enregistrement à l'arrêt.
schema: kuro.prefab/v1
id: ark-survival-ascended
version: 0.4.0
category: game
tags: [ark, survival, steam]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
  # Ressources du serveur entier (ADR-0031) : minimum bloquant, valeur recommandée pré-remplie.
  resources:
    memory_mb: { min: 8192, recommended: 16384 }
    cpu_percent: { min: 200, recommended: 400 }
    disk_mb: { min: 30720, recommended: 51200 }
assets:
  icon: assets/icon.png
  cover: assets/banner.png
  thumbnail: assets/thumbnail.png
x-status: "draft: not yet tried on a real node (Proton 10 runtime, world saved on SIGINT?)"
# Jeu sur le magasin Steam : le Studio en importe les images (ADR-0039).
steam: { app: 2399830 }

services:
  server:
    # Tag `proton_10` (GE-Proton 10-34) des eggs Pterodactyl, épinglé par empreinte : utilisateur
    # 1000, Proton dans /usr/local/bin, tini en point d'entrée.
    image: ghcr.io/parkervcp/steamcmd@sha256:7449885931bb470d6e40c491b4ff80528864bed61fcd31e6fbdf4e3d4bef0627
    # Arguments du serveur, chacun séparé (`"$@"` dans le script). `?listen` ouvre les ports ;
    # `ServerAdminPassword` reste la dernière option (le reste serait lu comme mot de passe).
    command:
      - bash
      - /data/kuro-start.sh
      - "{{ settings.map }}?listen?SessionName={{ settings.session_name }}?ServerPassword={{ settings.password }}?RCONEnabled=True?RCONPort={{ ports.rcon.container }}?ServerAdminPassword={{ settings.admin_password }}"
      - "-WinLiveMaxPlayers={{ settings.max_players }}"
      - "-port={{ ports.game.container }}"
      - -NoBattlEye
      - -servergamelog
      # Mode `reference` : le serveur télécharge lui-même les mods CurseForge listés.
      - "-mods={{ content.mods.ids | join(\",\") }}"
    env:
      HOME: /data/home
      # Préfixe Wine sur le volume : créé au premier démarrage, conservé ensuite.
      STEAM_COMPAT_DATA_PATH: /data/compat
      STEAM_COMPAT_CLIENT_INSTALL_PATH: /data/home
      UMU_ID: "0"
      WINEDEBUG: "-all"
    ports:
      # Le moteur ouvre aussi le port du jeu + 1 : réserver deux ports consécutifs.
      game: { container: 7777, protocol: udp, public: true }
      peer: { container: 7778, protocol: udp, public: true }
      # RCON : interne au réseau du serveur, jamais publié.
      rcon: { container: 27020 }
    volumes:
      data: { path: /data }
    writable: [/tmp]
    user: "1000:1000"

install:
  service: server
  steps:
    - steamcmd: { app: 2430930, dir: /data/server, platform: windows, validate: true }
    - copy: { template: templates/start.sh, to: /data/kuro-start.sh }
    - copy: { template: templates/Game.ini, to: /data/server/ShooterGame/Saved/Config/WindowsServer/Game.ini }

settings:
  general:
    session:
      icon: users
      fields:
        # `?` et `"` couperaient la ligne d'options du serveur.
        session_name: { type: string, default: "Kuro ARK", max_length: 63, pattern: '^[^?"]*$', required: true, restart: true }
        password: { type: password, pattern: '^[^?"\s]{0,64}$', restart: true }
        max_players: { type: int, default: 70, min: 1, max: 127, restart: true }
        map:
          type: enum
          options: [TheIsland_WP, ScorchedEarth_WP, TheCenter_WP, Aberration_WP, Extinction_WP]
          default: TheIsland_WP
          restart: true
  advanced:
    rates:
      icon: gauge
      fields:
        harvest_multiplier: { type: float, default: 1, min: 0.1, max: 100, step: 0.1, restart: true }
        xp_multiplier: { type: float, default: 1, min: 0.1, max: 100, step: 0.1, restart: true }
        taming_multiplier: { type: float, default: 1, min: 0.1, max: 100, step: 0.1, restart: true }
    administration:
      icon: shield
      fields:
        admin_password: { type: secret, generate: { length: 24 } }

files:
  game-user-settings:
    service: server
    path: /data/server/ShooterGame/Saved/Config/WindowsServer/GameUserSettings.ini
    format: ini
    mode: managed-keys
    keys:
      ServerSettings.HarvestAmountMultiplier: "{{ settings.harvest_multiplier }}"
      ServerSettings.XPMultiplier: "{{ settings.xp_multiplier }}"
      ServerSettings.TamingSpeedMultiplier: "{{ settings.taming_multiplier }}"
      ServerSettings.RCONEnabled: "True"
      ServerSettings.RCONPort: "{{ ports.rcon.container }}"
  game-ini:
    service: server
    path: /data/server/ShooterGame/Saved/Config/WindowsServer/Game.ini
    format: ini
    mode: user

content:
  mods:
    kind: mods
    service: server
    providers:
      - { provider: curseforge, game: ark-survival-ascended, class: mods }
    install: { mode: reference }

lifecycle:
  service: server
  # Premier démarrage long : préfixe Wine, puis plusieurs minutes avant d'être annoncé.
  ready: { console: 'advertising for join' }
  stop: { signal: SIGINT }
  timeout: 180
