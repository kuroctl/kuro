# yaml-language-server: $schema=https://raw.githubusercontent.com/kuroctl/kuro/main/shared/prefab/schema/prefab.v1.schema.json
# ownCloud Infinite Scale (oCIS) : un seul binaire Go, sans base de données (stockage décentralisé
# dans le volume de données). Le web n'est pas publié sur l'hôte : le proxy du nœud le sert en
# HTTPS à l'adresse du site (ADR-0038), oCIS écoute en HTTP.
# La configuration (`ocis init` : secrets, identifiants internes) est générée une fois, à
# l'installation, dans l'image officielle (étape `script`, point d'entrée vidé : ADR-0039).
schema: kuro.prefab/v1
id: owncloud-ocis
version: 1.0.0
category: web
tags: [owncloud, ocis, cloud, files]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
  resources:
    memory_mb: { min: 512, recommended: 1024 }
    disk_mb: { min: 2048, recommended: 20480 }
assets:
  icon: assets/icon.png
  cover: assets/banner.jpg
  thumbnail: assets/thumbnail.jpg
x-status: "draft: not yet tried on a real node (ocis init at install, first OIDC login behind the node proxy)"

services:
  server:
    # owncloud/ocis:8.2.2, épinglée par empreinte.
    image: docker.io/owncloud/ocis@sha256:08639361baa55e21037442daed4d8aa1a4fc4f2f12d06db92455a14782c29f61
    command: [server]
    env:
      OCIS_URL: "{{ server.web_url }}"
      # TLS terminé par le proxy du nœud ; oCIS appelle sa propre adresse (OIDC) et vérifie son
      # certificat, sauf sur un nœud de dev au certificat interne.
      PROXY_TLS: "false"
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
      OCIS_INSECURE: "{{ settings.trust_any_certificate }}"
      PROXY_ENABLE_BASIC_AUTH: "false"
      # Mot de passe de l'admin, appliqué à sa création au premier démarrage.
      IDM_ADMIN_PASSWORD: "{{ settings.admin_password }}"
      OCIS_LOG_LEVEL: "{{ settings.log_level }}"
      OCIS_LOG_PRETTY: "false"
    ports:
      # Port web : servi par le proxy du nœud, jamais publié sur l'hôte.
      http: { container: 9200, protocol: tcp, web: true }
    volumes:
      config: { path: /etc/ocis }
      data: { path: /var/lib/ocis }
    writable: [/tmp]
    user: "1000:1000"

install:
  service: server
  steps:
    # Une configuration existante (réinstallation) est gardée : ses secrets chiffrent les données.
    - script:
        run: "[ -f /etc/ocis/ocis.yaml ] || ocis init --insecure false"

settings:
  general:
    admin:
      icon: shield
      fields:
        admin_password: { type: secret, generate: { length: 24 } }
  advanced:
    logs:
      icon: file-code
      fields:
        log_level: { type: enum, options: [error, warn, info, debug], default: info, restart: true }
    tls:
      icon: shield
      fields:
        trust_any_certificate: { type: bool, default: false, restart: true }

files:
  config:
    service: server
    path: /etc/ocis/ocis.yaml
    format: yaml
    mode: user

lifecycle:
  service: server
  stop: { signal: SIGTERM }
  timeout: 30
