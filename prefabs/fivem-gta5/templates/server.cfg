# Configuration du serveur FiveM, libre : Kuro ne la réécrit pas.
# Nom, joueurs, ports d'écoute et jeu viennent du panel, par kuro.cfg (regénéré à chaque démarrage).
exec kuro.cfg

# Ressources de base : celles de resources/ (cfx-server-data), et les ressources système du build
# (chat, sessionmanager, hardcap, rconlog).
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
# Carte de départ (RedM : redm-map-one).
ensure fivem-map-skater
ensure hardcap
ensure rconlog

# Ajoutez vos ressources ici : ensure <nom>

sv_scriptHookAllowed 0
sets tags "default"
sets locale "fr-FR"

# Administrateurs (identifiants Cfx.re ou Steam) :
# add_principal identifier.fivem:1 group.admin
add_ace group.admin command allow
add_ace group.admin command.quit deny
