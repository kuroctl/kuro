# yaml-language-server: $schema=../schema/prefab.v1.schema.json
# Minecraft Java Edition : vanilla, Paper, Fabric, Quilt, Forge, NeoForge.
# L'image itzg/minecraft-server télécharge elle-même le serveur au premier démarrage : pas de bloc `install`.
schema: kuro.prefab/v1
id: minecraft-java
version: 1.4.0
category: game
tags: [minecraft, java, sandbox]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
assets:
  icon: assets/icon.png
  cover: assets/banner.png
  thumbnail: assets/thumbnail.png

services:
  server:
    # Tag daté figé (jamais `latest`), variante Java 25 : les versions récentes de Minecraft l'exigent.
    image: docker.io/itzg/minecraft-server:2026.10.1-java25
    env:
      EULA: "TRUE"
      TYPE: "{{ settings.loader | upper }}"
      VERSION: "{{ settings.version }}"
      MEMORY: "{{ resources.memory_mb }}M"
      # server.properties est géré par Kuro (fichier en `managed-keys`), pas par l'image.
      OVERRIDE_SERVER_PROPERTIES: "false"
    ports:
      # Le client Minecraft lit le SRV : le joueur tape le nom du serveur, sans le port.
      game: { container: 25565, protocol: tcp, public: true, srv: _minecraft._tcp }
      # Interne au réseau du serveur, jamais publié : sert à la console de Kuro.
      rcon: { container: 25575 }
    volumes:
      data: { path: /data }
    writable: [/tmp]
    user: "1000:1000"

settings:
  general:
    server:
      icon: server
      fields:
        motd: { type: string, default: "A Kuro server", max_length: 59 }
        max_players: { type: int, default: 20, min: 1, max: 500, restart: true }
        difficulty: { type: enum, options: [peaceful, easy, normal, hard], default: normal }
        gamemode: { type: enum, options: [survival, creative, adventure, spectator], default: survival }
        whitelist: { type: bool, default: false }
    version:
      icon: package
      fields:
        loader: { type: enum, options: [vanilla, paper, fabric, quilt, forge, neoforge], default: vanilla, editable: deploy, restart: true }
        version: { type: string, default: LATEST, pattern: "^(LATEST|SNAPSHOT|\\d+\\.\\d+(\\.\\d+)?)$", restart: true }
  advanced:
    world:
      icon: globe
      fields:
        level_seed: { type: string, max_length: 64, editable: deploy }
        view_distance: { type: slider, min: 3, max: 32, step: 1, default: 10, restart: true }
        pvp: { type: bool, default: true }
    security:
      icon: shield
      fields:
        online_mode: { type: bool, default: true, restart: true }
        rcon_password: { type: secret, generate: { length: 32 } }

files:
  server-properties:
    service: server
    path: /data/server.properties
    format: properties
    mode: managed-keys
    keys:
      server-port: "{{ ports.game.container }}"
      motd: "{{ settings.motd }}"
      max-players: "{{ settings.max_players }}"
      difficulty: "{{ settings.difficulty }}"
      gamemode: "{{ settings.gamemode }}"
      white-list: "{{ settings.whitelist }}"
      level-seed: "{{ settings.level_seed }}"
      view-distance: "{{ settings.view_distance }}"
      pvp: "{{ settings.pvp }}"
      online-mode: "{{ settings.online_mode }}"
      enable-rcon: "true"
      rcon.port: "{{ ports.rcon.container }}"
      rcon.password: "{{ settings.rcon_password }}"
  ops:
    service: server
    path: /data/ops.json
    format: json
    mode: user
  whitelist:
    service: server
    path: /data/whitelist.json
    format: json
    mode: user

content:
  mods:
    kind: mods
    service: server
    providers:
      - { provider: modrinth, game: minecraft, loader: "{{ settings.loader }}", game_version: "{{ settings.version }}" }
      - { provider: curseforge, game: minecraft, class: mods, loader: "{{ settings.loader }}", game_version: "{{ settings.version }}" }
      - { provider: upload }
    install: { mode: download, dir: /data/mods }
  plugins:
    kind: plugins
    service: server
    providers:
      - { provider: modrinth, game: minecraft, loader: paper, game_version: "{{ settings.version }}" }
      - { provider: upload }
    install: { mode: download, dir: /data/plugins }

# Sauvegarde à chaud : écritures suspendues et monde vidé sur disque pendant l'archivage.
backup:
  ignore:
    server: [/data/logs/**]
  before:
    - { console: save-off }
    - { console: save-all flush, wait: 'Saved the game' }
  after:
    - { console: save-on }

lifecycle:
  service: server
  ready: { console: 'Done \(\d+(\.\d+)?s\)!' }
  stop: { console: stop }
  timeout: 60
