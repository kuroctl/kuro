services:
  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 2s
      timeout: 3s
      retries: 15
    environment:
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: panel_dev_only
      POSTGRES_DB: panel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
